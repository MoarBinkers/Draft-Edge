    app=app.replace('r.classList.add("dragging");','r.classList.add("dragging");document.body.classList.add("is-dragging");');
    app=app.replace('function commitVisualOrder(){\n if(!dragState.el||dragState.index==null)return;','function commitVisualOrder(){\n document.body.classList.remove("is-dragging");\n if(!dragState.el||dragState.index==null)return;');
    app=app.replace('</style>','body.is-dragging,body.is-dragging *{cursor:grabbing!important}\n</style>');

    if(!app.startsWith('<!doctype html>')||!app.includes('DRAFT EDGE')||!app.includes('DRAFT_EDGE_SUPABASE_URL')||!app.trim().endsWith('</html>')){
      throw new Error('One of the app files was incomplete.');
    }
    if(!app.includes('dragGhostCanvas'))throw new Error('Drag cleanup could not be applied.');
    if(!app.includes(STABLE_LOGO.slice(0,80)))throw new Error('Logo repair could not be applied.');

    const scripts=[...app.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
      .map(m=>m[1]).filter(code=>code.trim());
    for(const code of scripts){
      try{new Function(code)}catch(e){throw new Error('App JavaScript syntax error: '+e.message)}
    }

    document.open();document.write(app);document.close();
  }catch(err){showError(err);console.error(err)}
})();
</script>
</body>
</html>
