<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Draft Edge</title>
<style>
html,body{margin:0;min-height:100%;background:#0b1016;color:#eef3f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.loading{min-height:100vh;display:grid;place-items:center}.box{text-align:center}.mark{font-size:28px;font-weight:1000;letter-spacing:-.04em}.sub{margin-top:8px;color:#8d9baa;font-size:12px}
</style>
</head>
<body>
<div class="loading"><div class="box"><div class="mark">DRAFT EDGE</div><div class="sub">Loading your draft room…</div></div></div>
<script>
(async()=>{
  try{
    const b64=await fetch('draft-edge-v21.payload?v=21').then(r=>{if(!r.ok)throw new Error('App payload not found');return r.text()});
    const raw=atob(b64.trim());
    const bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const app=await new Response(stream).text();
    document.open();document.write(app);document.close();
  }catch(err){
    document.body.innerHTML='<div class="loading"><div class="box"><div class="mark">DRAFT EDGE</div><div class="sub">Could not load the app. Refresh the page.</div></div></div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
