<div class="loading"><div class="box"><div class="mark">DRAFT EDGE</div><div class="sub">Loading your draft room…</div></div></div>
<script>
(async()=>{
 const fail=e=>{
  const m=String(e&&e.message?e.message:e).replace(/[&<>]/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[s]));
  document.body.innerHTML='<div class="loading"><div class="box"><div class="mark">DRAFT EDGE</div><div class="sub">The app could not start.</div><div class="err">'+m+'</div></div></div>';
 };
 try{
  if(!("DecompressionStream" in window))throw new Error("Your browser needs an update to open Draft Edge.");
  const files=Array.from({length:10},(_,i)=>'./app-v28-part-'+String(i).padStart(2,'0')+'.bin?v=28b');
  const buffers=await Promise.all(files.map(async file=>{
   const r=await fetch(file,{cache:"no-store"});
   if(!r.ok)throw new Error("Could not load "+file+" (HTTP "+r.status+").");
   return new Uint8Array(await r.arrayBuffer());
  }));
  const total=buffers.reduce((n,b)=>n+b.length,0);
  if(total!==28016)throw new Error("Draft Edge bundle was incomplete ("+total+" bytes).");
  const joined=new Uint8Array(total);
  let offset=0;
  for(const b of buffers){joined.set(b,offset);offset+=b.length}
  const text=await new Response(new Blob([joined]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  const digest=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(text));
  const hash=[...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,"0")).join("");
  if(hash!=="77a31b87341147e99b00dbe40a23961addc39723cb8464129cc3c68a13db0879")throw new Error("Draft Edge integrity check failed.");
  if(!text.startsWith("<!doctype html>")||!text.includes("DRAFT_EDGE_SUPABASE_URL")||!text.trim().endsWith("</html>"))throw new Error("Draft Edge app file was incomplete.");
  const patchTags="<scr"+"ipt src=\"./patch-v29.js?v=29\"></scr"+"ipt><scr"+"ipt src=\"./logo-fix-v291.js?v=291\"></scr"+"ipt><scr"+"ipt src=\"./tier-v33.js?v=33\"></scr"+"ipt><scr"+"ipt src=\"./player-detail-v34.js?v=34\"></scr"+"ipt><scr"+"ipt src=\"./central-adp-v36.js?v=36\"></scr"+"ipt><scr"+"ipt src=\"./adp-copy-v361.js?v=361\"></scr"+"ipt><scr"+"ipt src=\"./rank-sync-v38.js?v=39\"></scr"+"ipt><scr"+"ipt src=\"./sleeper-update-status-v40.js?v=40\"></scr"+"ipt><scr"+"ipt src=\"./cloud-reliability-v41.js?v=41\"></scr"+"ipt><scr"+"ipt src=\"./draft-room-v41.js?v=41\"></scr"+"ipt><scr"+"ipt src=\"./reset-draft-v42.js?v=42\"></scr"+"ipt><scr"+"ipt src=\"./draft-live-v43.js?v=43\"></scr"+"ipt><scr"+"ipt src=\"./sleeper-auto-draft-v44.js?v=44\"></scr"+"ipt></body>";
  const app=text.replace("</body>",patchTags);
  document.open();document.write(app);document.close();
 }catch(e){console.error(e);fail(e)}
})();
</script>
