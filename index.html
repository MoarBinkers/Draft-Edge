<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Draft Edge</title>
<style>
html,body{margin:0;min-height:100%;background:#0b1016;color:#eef3f7;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;padding:24px}.box{text-align:center;max-width:720px}.mark{font-size:30px;font-weight:1000;letter-spacing:-.04em}.sub{margin-top:8px;color:#8d9baa;font-size:13px;line-height:1.55}.err{margin-top:14px;padding:12px 14px;border:1px solid #4a3340;border-radius:10px;background:#1c141a;color:#f3b6c2;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-word}
</style>
</head>
<body>
<div class="loading"><div class="box"><div class="mark">DRAFT EDGE</div><div class="sub">Loading your draft room…</div></div></div>
<script>
(async()=>{
  const showError=(err)=>{
    const msg=String(err&&err.message?err.message:err).replace(/[&<>]/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[s]));
    document.body.innerHTML='<div class="loading"><div class="box"><div class="mark">DRAFT EDGE</div><div class="sub">The app could not start. Error:</div><div class="err">'+msg+'</div></div></div>';
  };
  try{
    const files=Array.from({length:8},(_,i)=>'./app-v22-part-'+String(i).padStart(2,'0')+'.txt?v=24');
    const parts=await Promise.all(files.map(async file=>{
      const r=await fetch(file,{cache:'no-store'});
      if(!r.ok)throw new Error('Could not download '+file+' (HTTP '+r.status+')');
      return r.text();
    }));
    let app=parts.join('');

    // Repair punctuation that was lost during the earlier plain-text transfer.
    app=app.replaceAll('row.push(cell.replace(/\\r$/," ");rows.push(row)','row.push(cell.replace(/\\r$/," "));rows.push(row)');
    app=app.replaceAll('row.push(cell.replace(/\\r$/,"" );rows.push(row)','row.push(cell.replace(/\\r$/,""));rows.push(row)');
    app=app.replaceAll('row.push(cell.replace(/\\r$/,"" );rows.push(row)}','row.push(cell.replace(/\\r$/,""));rows.push(row)}');
    app=app.replaceAll('row.push(cell.replace(/\\r$/,"" );rows.push(row);','row.push(cell.replace(/\\r$/,""));rows.push(row);');
    app=app.replace(/row\.push\(cell\.replace\(\/\\r\$\/\s*,\s*""\s*\);rows\.push\(row\)/g,'row.push(cell.replace(/\\r$/,""));rows.push(row)');

    // Critical startup fix: the auth DOM was after the main script, so binding auth buttons
    // threw an error and prevented the remaining X handlers + Sleeper refresh from running.
    const authMatch=app.match(/(<div class="auth-gate" id="authGate">[\s\S]*?<\/div>\s*<\/div>)\s*(?=<\/body>)/i);
    if(authMatch){
      const authBlock=authMatch[1];
      app=app.replace(authBlock,'');
      const mainMarker='<script>\nconst INITIAL=';
      if(!app.includes(mainMarker))throw new Error('Could not locate Draft Edge startup script.');
      app=app.replace(mainMarker,authBlock+'\n\n'+mainMarker);
    }

    // Always open to the full Sleeper market on a new page load.
    app=app.replace('adpPos=localStorage.getItem("de_adp_pos")||adpPos;','adpPos="ALL";');
    app=app.replace('let page=localStorage.getItem("de_last_page")||"adp";','let page="adp";');

    // Use active Sleeper players, keep every ranked QB/RB/WR/TE, and cache the pool so reloads
    // can show players immediately while the fresh request runs.
    app=app.replace('let sleeperPool=structuredClone(INITIAL).map(p=>({...p,tier:null,tags:[],note:"",drafted:false}));','let sleeperPool=JSON.parse(localStorage.getItem("de_sleeper_pool")||"null")||structuredClone(INITIAL).map(p=>({...p,tier:null,tags:[],note:"",drafted:false}));');
    app=app.replace('https://api.sleeper.app/v1/players/nfl"','https://api.sleeper.app/v1/players/nfl?active=true"');
    app=app.replace('if(POS.includes(x.pos)&&newPool.length<450)newPool.push(','if(POS.includes(x.pos))newPool.push(');
    app=app.replace('sleeperPool=newPool;\n  save();','sleeperPool=newPool;\n  localStorage.setItem("de_sleeper_pool",JSON.stringify(newPool));\n  save();');

    // Global X fallback: any close button closes whichever modal/drawer contains it.
    const closeAnchor='document.getElementById("drawer").addEventListener("mousedown",e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove("open")});';
    if(app.includes(closeAnchor)){
      app=app.replace(closeAnchor,closeAnchor+'\n\ndocument.addEventListener("click",e=>{let x=e.target.closest("button.close");if(!x)return;e.preventDefault();e.stopPropagation();let modal=x.closest(".modal");if(modal)modal.classList.remove("open");let drawer=x.closest(".drawer");if(drawer)drawer.classList.remove("open");let side=x.closest(".left-drawer");if(side)side.classList.remove("open");if(x.id==="closeTagDrawer"){document.getElementById("tagDrawer")?.classList.remove("open");document.getElementById("tagDrawerBackdrop")?.classList.remove("open")}});');
    }

    if(!app.startsWith('<!doctype html>')||!app.includes('DRAFT EDGE')||!app.includes('DRAFT_EDGE_SUPABASE_URL')||!app.trim().endsWith('</html>')){
      throw new Error('One of the app files was incomplete.');
    }

    // Syntax-check inline JavaScript after all repairs, before replacing the loader page.
    const scripts=[...app.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
      .map(m=>m[1]).filter(code=>code.trim());
    for(const code of scripts){
      try{new Function(code)}catch(e){throw new Error('App JavaScript syntax error: '+e.message)}
    }

    document.open();document.write(app);document.close();
  }catch(err){showError(err);console.error(err)}
})();
</script>
</body>
</html>
